[project]
name = "cs-tactical-lens"
version = "4.1.0"
description = "把真实 CS2 比赛 Demo 转化为可复核的多场接触前结构比较工作台"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "eastiro", email = "eastiro@users.noreply.github.com"}
]
dependencies = [
    "streamlit>=1.48,<2.0",
    "pandas>=2.2,<3.0",
    "plotly>=6.0,<7.0",
    "awpy>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/eastiro/cs-tactical-lens"
Repository = "https://github.com/eastiro/cs-tactical-lens"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line-too-long (handled by line-length)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # 测试文件允许未使用的 import

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", ".venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
