name: Test

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.17,<0.18"

      - name: Lint (ruff)
        run: python -m ruff check app.py src scripts tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile public Python code
        run: |
          python -m compileall -q app.py src

      - name: Run data-independent smoke tests
        run: |
          python -m pytest -q \
            tests/test_analytics.py \
            tests/test_economy.py \
            tests/test_map_geometry.py \
            tests/test_replay.py \
            tests/test_tactics.py \
            tests/test_team_map_comparison.py \
            tests/test_utility_efficiency.py \
            tests/test_utility_labels.py

      - name: Run showcase-bundle tests
        # The committed showcase bundle is the only data CI has; tests that
        # need the full local corpus skip themselves via tests/conftest.py.
        run: |
          python -m pytest -q tests/test_showcase_bundle.py
